; Doom RPG - ESP32 Cheap Yellow Display (ESP32-2432S028R)

[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_engine.py

; esp32_sdl.cpp is generated into the build directory by build_engine.py so
; the ESP32 port can specialize indexed texture ownership without modifying
; the source-tree compatibility implementation used as the patch baseline.
;
; Keep the PR #28 fitted-layout implementation in-tree as the 1afa0223 recovery
; reference, but compile the touch-ready variant in this increment because both
; files intentionally define the same ESP32 linker wrapper.
build_src_filter =
    +<*>
    -<esp32_sdl.cpp>
    -<native_main_menu_160x120_layout.c>

build_type = release
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; The game data will live on the SD card. This is sufficient for the first
; firmware milestones; it can later be replaced by a larger app partition.
board_build.partitions = no_ota.csv

build_flags =
    -D DOOMRPG_ESP32=1
    -D DOOMRPG_ESP32_SCREEN_DIAGNOSTICS=0
    -D USER_SETUP_LOADED=1

    ; Render.c stays identical to the desktop source. Redirect only the ESP32
    ; link to a CYD bridge that reuses PlatformVideo's existing framebuffer and
    ; prevents Render_free() from freeing storage owned by PlatformVideo.
    -Wl,--wrap=Render_startup
    -Wl,--wrap=Render_free

    ; The first native gameplay-frame path reuses the recovered fixed-point
    ; projection helpers while keeping legacy BSP/runtime arrays NULL. Inject
    ; native textured floor/ceiling immediately after column-scale init, and
    ; preserve Render.tmpLine around the legacy bounding-box helper it uses as
    ; scratch so the scaffolding Render object is bit-stable after the frame.
    -Wl,--wrap=Render_initColumnScale
    -Wl,--wrap=Render_cullBoundingBox

    ; Dynamic native doors remain in EspMapLineState, never in the immutable
    ; runtime arena. Scope a render-only line view across one complete gameplay
    ; frame so world raster + sprite depth both skip currently open door lines.
    ; Regular legacy doors use a 76-byte bounded animation owner: transient x/y
    ; compact geometry plus Render_clipLine texture-z correction are visible only
    ; during the four-frame animation lease. Source/runtime records stay exact.
    -Wl,--wrap=EspNativeGameplayFrame_renderTurn
    -Wl,--wrap=EspMapRuntime_getLine
    -Wl,--wrap=EspMapLineState_view
    -Wl,--wrap=Render_clipLine
    -Wl,--wrap=EspMapLineState_applyDoorCommand

    ; Native MOVE reproduces legacy source EXIT and destination ENTER tile-event
    ; phases for the bounded OPENLINE/CLOSELINE family. The wrappers keep those
    ; mutations transactionally coupled to the committed view + rendered frame.
    -Wl,--wrap=EspNativeGameplayDispatch_commitMove
    -Wl,--wrap=EspNativeGameplayDispatch_rollbackMove

    ; SELECT may execute one bounded EV_NOTE prefix immediately before an owned
    ; DIALOG/DIALOGNOBACK. The dialog pause boundary now owns a bounded saved
    ; continuation chain: SHOW/HIDE/UNLOCK plus state ops 11/19/20. The begin
    ; wrapper preflights the complete chain before UI; resume/rollback keep world
    ; mutation transactional with the following resident redraw.
    -Wl,--wrap=EspNativeGameplayDialog_begin
    -Wl,--wrap=EspNativeGameplayDialog_resume
    -Wl,--wrap=EspNativeGameplayDialog_rollbackResume

    ; One production-service wrapper emits a one-shot resident interaction corpus
    ; so hardware testing sees unsupported opcode families before reaching them.
    -Wl,--wrap=EspNativeResidentGameplay_service

    ; Generic weapon pickups are a post-commit touch family. One compact bitset
    ; hides consumed resident sprites, the HUD view exposes a tiny selected-weapon
    ; overlay, and the player-view commit wrapper records only moves that survive
    ; the dispatch transaction. Session service/reset own deferred touch delivery
    ; and lifetime without mutating legacy Player/Entity/Render world state.
    -Wl,--wrap=EspMapRuntime_getMapSprite
    -Wl,--wrap=EspNativeGameplayHud_view
    -Wl,--wrap=EspPlayerView_commitPreparedMove
    -Wl,--wrap=EspNativeGameplaySession_service
    -Wl,--wrap=EspNativeGameplaySession_reset

    ; Read-only first-frame fidelity diagnostics measure COLORSTATS during the
    ; validated native route and arm the post-PARK BMP export. Presentation is
    ; now the permanent raw RGB565 PlatformVideo path with no color wrapper.
    -Wl,--wrap=EspNativeFirstFrame_route

    ; Gameplay TURN temporarily reuses the historical first-frame world route.
    ; Suppress only that route's redundant intermediate presentation; normal
    ; video presentation remains untouched unless the one-shot gate is armed.
    -Wl,--wrap=Esp32PlatformVideo_present

    ; Historical hardware-proven predecessor probes still execute, but normal
    ; first-frame development silences their success chatter. FAILED/ERROR lines
    ; remain visible. The lifecycle bridge fast-forwards them in strict order.
    -Wl,--wrap=printf
    -Wl,--wrap=puts

    ; During real menu runtime structure startup this wrapper is transparent for
    ; normal calls, then intercepts the loading-bar boundary immediately after
    ; menu.bsp structural parsing and before Render_loadBitShapes().
    -Wl,--wrap=DoomCanvas_updateLoadingBar

    ; Post-intro lifecycle bridge for the native BSP reader. The intro disposer
    ; itself remains the PR #41 hardware-validated implementation. The wrappers
    ; only reset/trigger the one-shot native /intro.bsp pass-1 inventory on the
    ; following loop; no Render_beginLoadMapData()/bitshape gate is used anymore.
    -Wl,--wrap=Esp32IntroDispose_reset
    -Wl,--wrap=Esp32IntroDispose_service

    ; Sprite caching remains available to the optional full bring-up suite.
    ; These wrappers are transparent while the cache is inactive.
    -Wl,--wrap=EspNativeGraphics_loadSpriteFrame
    -Wl,--wrap=EspNativeGraphics_releaseSpriteFrame

    ; The validated walls+sprites probe remains compiled for the optional
    ; esp32-cyd-bringup environment. Normal boot now presents MENU_MAIN directly
    ; after real runtime structures are resident.
    -Wl,--wrap=DoomRPG_probeNativeMenuSpriteFrame

    ; Keep the faithful original overlay and PR #28 layout source as references,
    ; but route the active ESP32 presentation through the touch-ready opaque
    ; 160x120 wrapper. The same bounded painter is reused by Options -> Back.
    -Wl,--wrap=DoomRPG_probeNativeMainMenuOverlay

    ; PlatformInput emits one generic callback per physical press. The validated
    ; PR #29 gate enforces select-then-confirm semantics. Confirmed Options is
    ; executed directly from that gate; do not wrap the callback function itself
    ; because its address is taken in its defining translation unit.
    -Wl,--wrap=PlatformInput_setTapCallback

    ; build_engine.py compiles the generated esp32_sdl.cpp as an explicit
    ; BuildSources target. PlatformIO does not inject lib_deps/library include
    ; paths into that target, so expose the two headers used by TFT_eSPI here.
    -I.pio/libdeps/esp32-cyd/TFT_eSPI
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src

    ; ILI9341 display, native portrait dimensions. The firmware rotates it to
    ; 320x240 landscape at runtime. Hardware validation confirmed inversion ON,
    ; controller BGR order and TFT_eSPI byte swapping with raw RGB565 pixels.
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON
    -D TFT_RGB_ORDER=TFT_BGR

    ; TFT on the CYD's HSPI wiring. MISO is intentionally omitted because the
    ; Doom backend only writes to the display.
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000

    ; Keep only the tiny built-in font for the optional hardware diagnostic.
    ; Doom uses its own bitmap fonts for normal game/menu presentation.
    -D LOAD_GLCD=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; Full historical validation mode. The default esp32-cyd environment intentionally
; leaves DOOMRPG_ESP32_BRINGUP_PROBES undefined, which makes the C-side default 0.
; Use this environment only when re-validating resource budgets, native GFXRM,
; projected walls, complete menu walls/sprites and their deterministic hashes.
;
; Touch hitboxes are also drawn directly on the physical TFT in this profile.
; They are deliberately outside the 160x120 framebuffer, so regression FNVs are
; unchanged. Cyan/yellow marks show the latest semantic calibrated touch.
[env:esp32-cyd-bringup]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D DOOMRPG_ESP32_BRINGUP_PROBES=1
    -D DOOMRPG_ESP32_TOUCH_HITBOX_OVERLAY=1
