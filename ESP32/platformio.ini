; Doom RPG - ESP32 Cheap Yellow Display (ESP32-2432S028R)

[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_engine.py

; Production source policy:
; - permanent generic engine/runtime modules live in ESP32/src;
; - historical map-specific probe ladders live only in Git history;
; - a new BSP must never require another native_mapN_* source ladder.
;
; esp32_sdl.cpp is generated into the build directory by build_engine.py.
; Historical pre-touch main-menu layout/probe sources were retired after the
; finger-first opaque main menu became the hardware-validated owner.
build_src_filter =
    +<*>
    -<esp32_sdl.cpp>

build_type = release
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.partitions = partitions_cyd_raw_pak.csv

build_flags =
    -D DOOMRPG_ESP32=1
    -D DOOMRPG_ESP32_SCREEN_DIAGNOSTICS=0
    -D USER_SETUP_LOADED=1

    ; Legacy Render remains a compatibility shell around the native runtime.
    -Wl,--wrap=Render_startup
    -Wl,--wrap=Render_free

    ; Native fixed-point world projection while legacy BSP arrays stay NULL.
    -Wl,--wrap=Render_initColumnScale
    -Wl,--wrap=Render_cullBoundingBox

    ; Dynamic native line/door rendering and bounded regular-door animation.
    -Wl,--wrap=EspNativeGameplayFrame_renderTurn
    -Wl,--wrap=EspMapRuntime_getLine
    -Wl,--wrap=EspMapLineState_view
    -Wl,--wrap=Render_clipLine
    -Wl,--wrap=EspMapLineState_applyDoorCommand

    ; Transactional MOVE event execution.
    -Wl,--wrap=EspNativeGameplayDispatch_commitMove
    -Wl,--wrap=EspNativeGameplayDispatch_rollbackMove

    ; Bounded dialog pause/resume continuation transaction.
    -Wl,--wrap=EspNativeGameplayDialog_begin
    -Wl,--wrap=EspNativeGameplayDialog_resume
    -Wl,--wrap=EspNativeGameplayDialog_rollbackResume

    ; Production interaction-chain corpus wrapper. This is permanent gameplay
    ; instrumentation, not a historical map probe.
    -Wl,--wrap=EspNativeResidentGameplay_service

    ; Temporary CHANGEMAP recovery witness. This wrapper reads only the already
    ; resident map corpus and native PAK strings.
    -Wl,--wrap=EspNativeGameplayInteractionInventory_log

    ; Generic SELECT transition sits in front of the existing tile-event/entity
    ; fallback. Input reset also clears the durable WAIT_STATS owner.
    -Wl,--wrap=EspNativeGameplayAction_executeSelect
    -Wl,--wrap=EspNativeGameplayInput_reset
    -Wl,--wrap=EspMapSpriteTopology_getEntity
    -Wl,--wrap=EspMapSpriteTopology_getVisualState

    ; Compact native monster state + generic type1 combat compose around the
    ; proven action engine. The combat backend is table-driven by monster
    ; subtype/mType and shared native player ammo/weapon ownership.
    -Wl,--wrap=EspNativeGameplayActionEngine_service
    -Wl,--wrap=EspNativeGameplayActionEngine_reset
    -Wl,--wrap=EspNativeGameplayActionEngine_executeSelect

    ; A committed jammed-door line death is a legacy player attack and therefore
    ; advances the monster turn. The small bridge arms at line-death commit,
    ; cancels on rollback, then requests the proven turn producer downstream.
    -Wl,--wrap=EspNativeGameplayDestructible_executeLineDeath
    -Wl,--wrap=EspNativeGameplayDestructible_rollbackLineDeath

    ; Generic player-resource pickup/HUD ownership plus composed sprite
    ; presentation for consumed pickups and explicit monster pain/death frames.
    ; The same immutable-sprite overlay now projects committed native monster
    ; positions without mutating BSP sprite records.
    -Wl,--wrap=EspMapRuntime_getMapSprite
    -Wl,--wrap=EspNativeGameplayHud_view
    -Wl,--wrap=EspPlayerView_commitPreparedMove
    -Wl,--wrap=EspNativeGameplaySession_service
    -Wl,--wrap=EspNativeGameplaySession_reset

    ; One-slot native checkpoint shared by HUB -> STAT and MENU_MAIN -> Load
    ; Game. HUB owns SAVE/LOAD controls; the main menu exposes LOAD only. World
    ; serialization stays explicitly bounded to a fresh BSP rebuild plus the
    ; versioned mutable-owner sections. Reconfigure also restores the tiny HUD
    ; semantic owners consumed by the saved settled PlayerView; New Game and
    ; CHANGEMAP keep their existing routes.
    -Wl,--wrap=EspNativeGameplayHub_handleAction
    -Wl,--wrap=EspNativeGameplayHubTouchUi_classify
    -Wl,--wrap=EspNativeGameplayInput_consume
    -Wl,--wrap=EspNativeGameplaySession_configure

    ; Generic monster-turn recovery remains immediately after the permanent
    ; resource/action session leaf. The producer now explicitly services the
    ; compact map-session activation filter before downstream read-only consumers.
    ; Activation still comes from the same BSP sprite
    ; admission used by native rendering, matching legacy Render_renderSpriteObject
    ; -> Game_activate instead of the historical center-ray approximation.
    -Wl,--wrap=EspNativeGameplayPlayerResources_sessionService
    -Wl,--wrap=EspNativeGameplayPlayerResources_sessionReset
    -Wl,--wrap=EspNativeBspVisibility_mapSpriteVisible
    -Wl,--wrap=DoomRPG_randNextByte
    -Wl,--wrap=DoomRPG_randNextInt

    ; Native monster spatial owner + bounded legacy movement planner. The proven
    ; single-candidate planner remains unchanged. MovementProbe now calls the
    ; compact ActiveSequence service explicitly; that sequencer expands one
    ; no-immediate-attack monster turn across active monsters in first-activation
    ; order while preserving planner RNG replay, topology publication and the
    ; subtype 4/13 continuation hook per member. Ranged multi-active ordering and
    ; simultaneous attack-ready ordering remain fail-closed.

    ; Subtype 4/13 legacy i=3 continuation. Goals 2/3 reuse the proven movement
    ; publication transaction and consume exactly one visit-choice RNG byte each.
    ; The final three-shot attack family remains fail-closed in this milestone.

    ; Final player-resource projection layer. Consumed resource sprites are
    ; hidden/unlinked at the topology leaf observed by monster composition, and
    ; the bottom HUD is repainted only when native player state actually changes.
    -Wl,--wrap=EspNativeGameplayActionEngine_getVisualState
    -Wl,--wrap=EspNativeGameplayActionEngine_getEntity
    -Wl,--wrap=EspNativeGameplayHudDirection_render

    ; Native first-frame diagnostics and presentation gate.
    -Wl,--wrap=EspNativeFirstFrame_route
    -Wl,--wrap=Esp32PlatformVideo_present

    ; Raw current-map backing milestone. Resident-cache begin first stages all
    ; non-map PAK data plus the current BSP into the unmounted raw data partition.
    ; readRange timing remains instrumented so the real CYD can A/B SD vs flash.
    -Wl,--wrap=EspAssetPack_residentBegin
    -Wl,--wrap=EspAssetPack_readRange
    -Wl,--wrap=EspAssetPack_residentResetStats
    -Wl,--wrap=EspAssetPack_residentEnd

    ; Bounded graphics caches.
    -Wl,--wrap=EspNativeGraphics_loadSpriteFrame
    -Wl,--wrap=EspNativeGraphics_releaseSpriteFrame

    ; Calibrated touch callback routing.
    -Wl,--wrap=PlatformInput_setTapCallback

    ; build_engine.py compiles generated esp32_sdl.cpp as an explicit target.
    -I.pio/libdeps/esp32-cyd/TFT_eSPI
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src

    ; ILI9341 / classic CYD display configuration.
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D LOAD_GLCD=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; Optional diagnostic profile for the active platform/menu/graphics bootstrap.
; Canonical gameplay/RAM validation remains the normal esp32-cyd environment.
[env:esp32-cyd-bringup]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D DOOMRPG_ESP32_BRINGUP_PROBES=1
    -D DOOMRPG_ESP32_TOUCH_HITBOX_OVERLAY=1

    ; Historical menu.bsp structural/render regression suite. Production boots
    ; directly into the opaque native menu and must not retain these seams.
    -Wl,--wrap=Render_beginLoadMap
    -Wl,--wrap=DoomCanvas_updateLoadingBar
    -Wl,--wrap=DoomRPG_probeNativeMenuSpriteFrame
    -Wl,--wrap=DoomRPG_probeNativeMainMenuOverlay
