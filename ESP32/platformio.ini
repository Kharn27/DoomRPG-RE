; Doom RPG - ESP32 Cheap Yellow Display (ESP32-2432S028R)

[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_engine.py

; Production source policy:
; - permanent generic engine/runtime modules live in ESP32/src;
; - historical map-specific probe ladders live only in Git history;
; - a new BSP must never require another native_mapN_* source ladder.
;
; SDL-F3/F33: no SDL shim translation unit enters any ESP32 firmware.
; The exact historical SDL implementation now lives under ESP32/test/oracles,
; NOT ESP32/src. The negative src_filter remains fail-closed; the pre-script
; also rejects its resurrection under src. PlatformVideo_begin owns the TFT;
; compiledb/ELF prove exclusion and native source ownership.
; SDL-F22/F32: the retired SDL_RWops/SDL_Surface BMP decoder was already
; excluded from every firmware; its original .cpp/.h now live unchanged in
; ESP32/test/oracles for historical host regression tests only. Preserve the
; negative source filters as a fail-closed guard against accidental revival.
build_src_filter =
    +<*>
    -<esp32_sdl.cpp>
    -<esp32_bmp.cpp>

build_type = release
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0
board_build.partitions = partitions_cyd_raw_pak.csv

build_flags =
    -D DOOMRPG_ESP32=1
    ; Temporary R-A2b normal-firmware witness, no extra framebuffer or SD I/O.
    ; Remove when golden frames and real CYD measurements have PASSed.
    -D DOOMRPG_RA2B_CAPTURE=1
    -D DOOMRPG_ESP32_SCREEN_DIAGNOSTICS=0
    -D USER_SETUP_LOADED=1
    ; TFT_eSPI is LCD-only; native SoftXpt2046 owns the XPT2046 pins.
    ; Official TFT_eSPI opt-out for its expected 'TOUCH_CS not defined'
    ; #warning (the library has no independent touch driver in this build).
    ; This does NOT disable compiler warnings, GCC errors, or our own guards.
    ; Never define a fake TOUCH_CS to silence the warning: doing so would
    ; enable TFT_eSPI's competing touch extension and change GPIO init.
    -D DISABLE_ALL_LIBRARY_WARNINGS=1
    ; doomrpg_log.h defaults the normal firmware to INFO.
    ; Trace and bringup explicitly raise this to TRACE.

    ; Render startup stays private to the native initialization bridge.
    ; The native process-root destructor detaches PlatformVideo's framebuffer
    ; before releasing Render compatibility slots on fatal teardown.

    ; Native node-bounds culling has scalar/private scratch; the old
    ; Render_t tmpLine is desktop-only. World planes still
    ; render after column reset, without hidden Render wrappers.
    ; Dynamic native line/door rendering and bounded regular-door animation.
    ; ARCH-RC23: renderTurn public facade -> renderTurnBase raw frame leaf;
    ; the native door transaction owns scopes/results, no linker interposition.
    ; Owned effects compose through the same line adapter, then publish once.
    ; Ambient previews must see EV_UNLOCK and opened door overlays too.
    ; Preview renders need the same door/open-line adaptation as cardinal frames.
    ; ARCH-RC19: immutable getLine + mutable view compose directly via Base leaves.
    ; The active renderTurn door-transaction wrapper stays in force.

    ; ARCH-RC16: MOVE EXIT -> raw position -> ENTER -> rollback leases
    ; compose through the public native MoveEvents facade, no GNU --wrap.

    ; ARCH-RC12: NOTE+dialog begin and continuation/rollback now use explicit
    ; native owner APIs. No GNU linker interposition for this transaction.

    ; Generic SELECT transition sits in front of the existing tile-event/entity
    ; fallback. Input reset also clears the durable WAIT_STATS owner.
    ; ARCH-RC20: canonical raw topology Base -> ActionEngine -> projected
    ; resources/crates -> MonsterCombat public getters, explicit no-wrap chain.

    ; ARCH-RC13: four SELECT/service/reset wrappers retired into explicit
    ; native Transition -> MonsterCombat -> ActionEngine -> event composition.
    ; Compact native monster state + generic type1 combat compose around the
    ; proven action engine. The combat backend is table-driven by monster
    ; subtype/mType and shared native player ammo/weapon ownership.

    ; ARCH-RC15: jammed-door death/rollback and regular door OPENLINE use
    ; explicit public composition over native raw leaves (no ld interposition).
    ; A committed jammed-door line death is a legacy player attack and therefore
    ; advances the monster turn. The small bridge arms at line-death commit,
    ; cancels on rollback, then requests the proven turn producer downstream.

    ; ARCH-RC22: raw PlayerView MOVE commit -> resource pending-move facade;
    ; raw HUD owner snapshot -> live PlayerState HUD overlay facade (no wrap).
    ; Generic player-resource pickup/HUD ownership plus composed sprite
    ; presentation for consumed pickups and explicit monster pain/death frames.
    ; The same immutable-sprite overlay now projects committed native monster
    ; positions without mutating BSP sprite records.

    ; Ten-slot SD checkpoint shared by HUB -> SYSTEM and MENU_MAIN -> Load
    ; Game. HUB owns SAVE/LOAD controls; the main menu exposes LOAD only. World
    ; serialization stays explicitly bounded to a fresh BSP rebuild plus the
    ; versioned mutable-owner sections. Reconfigure also restores the tiny HUD
    ; semantic owners consumed by the saved settled PlayerView; New Game and
    ; CHANGEMAP keep their existing routes.
    ; ARCH-RC6: transition first, input second, owned in EspNativeGameplayInput_reset.

    ; ARCH-RC8: monster-turn recovery follows the resource/action leaf through
    ; an explicit call from the existing native session coordinator, which
    ; services the
    ; compact map-session activation filter before downstream read-only consumers.
    ; Activation still comes from the same BSP sprite
    ; admission used by native rendering, matching legacy Render_renderSpriteObject
    ; -> Game_activate instead of the historical center-ray approximation.

    ; Native monster spatial owner + bounded legacy movement planner. The proven
    ; single-candidate planner remains unchanged. MovementProbe now calls the
    ; compact ActiveSequence service explicitly; that sequencer expands one
    ; no-immediate-attack monster turn across active monsters in first-activation
    ; order while preserving planner RNG replay, topology publication and the
    ; subtype 4/13 continuation hook per member. Ranged multi-active ordering and
    ; simultaneous attack-ready ordering remain fail-closed.

    ; Subtype 4/13 legacy i=3 continuation. Goals 2/3 reuse the proven movement
    ; publication transaction and consume exactly one visit-choice RNG byte each.
    ; The final three-shot attack family remains fail-closed in this milestone.

    ; ARCH-RC5: HUD direction publishes its live-player projection through
    ; an explicit post-render hook (no GNU ld interposition).
    ; ARCH-RC7: final resource/crate/attack visual projection is an explicit
    ; read-only API called by combat and monster trace, not linker --wrap.
    ; Keep the two public topology wrappers and the sprite-position wrapper:
    ; their wider consumer/rollback contracts are outside this bounded lot.

    ; Native presentation gate. First-frame COLORSTATS/BMP diagnostics are
    ; bring-up-only and must not intercept the production gameplay route.
    -Wl,--wrap=Esp32PlatformVideo_present

    ; Raw current-map backing milestone. Resident-cache begin first stages all
    ; non-map PAK data plus the current BSP into the unmounted raw data partition.
    ; readRange timing remains instrumented so the real CYD can A/B SD vs flash.
    ; ARCH-RC18: EspAssetPack_residentBegin composes directly via native Base leaf (no --wrap).
    ; ARCH-RC2: stats-reset TRACE publication is an explicit before/after
    ; callback in the PAK owner, not a linker interposition.
    ; ARCH-RC3: residentEnd TRACE publication/invalidation is an explicit
    ; before callback, including the openReady failure path.
    ; ARCH-RC4: readRange logical TRACE timing/threshold has an explicit
    ; before/after pair around the unchanged PAK core (all return paths).

    ; Calibrated touch callback routing.
    ; ARCH-RC18: PlatformInput_setTapCallback composes directly via native Base leaf (no --wrap).

    ; SDL-A: permanent indexed shim is built once from ESP32/src.
    -I.pio/libdeps/esp32-cyd/TFT_eSPI
    -I${sysenv.HOME}/.platformio/packages/framework-arduinoespressif32/libraries/SPI/src

    ; ILI9341 / classic CYD display configuration.
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000
    -D LOAD_GLCD=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; Alternate classic-CYD LCD batch: ONLY change the controller INVON/INVOFF
; polarity. All core/render/RGB565/touch/SD/cache flags inherit the canonical
; esp32-cyd profile. Additional include path makes this env standalone:
; no need to build esp32-cyd first to populate .pio/libdeps.
[env:esp-cyd-inverted]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D DOOMRPG_CYD_ALTERNATE_PANEL_INVERSION=1
    -I.pio/libdeps/esp-cyd-inverted/TFT_eSPI

; Optional diagnostic profile for the active platform/menu/graphics bootstrap.
; Canonical gameplay/RAM validation remains the normal esp32-cyd environment.
[env:esp32-cyd-bringup]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D DOOMRPG_ESP32_BRINGUP_PROBES=1
    -D DOOMRPG_ESP32_TOUCH_HITBOX_OVERLAY=1
    -D DOOMRPG_LOG_LEVEL=4

    ; ARCH-RC1: two historical scene-to-dashboard --wrap flags retired.
    ; Neither had a linked __wrap_ body or a direct-call witness in ARCH-RC0's
    ; four real ELFs. All still-active diagnostic wrappers remain below.
    ; Keep the normal/inverted engine flags strictly inherited and unchanged.

    ; Historical first-frame fidelity instrumentation. The real renderer route
    ; stays production-owned; bringup may add read-only COLORSTATS/BMP capture.
    -Wl,--wrap=EspNativeFirstFrame_route

    ; Read-only interaction/CHANGEMAP corpus recovery. Normal INFO firmware
    ; neither calls the inventory logger nor links this temporary wrapper.
    -Wl,--wrap=EspNativeGameplayInteractionInventory_log

    ; Historical interaction-chain opcode census. The real resident gameplay
    ; service is direct in production; bringup may interpose this read-only scan.
    -Wl,--wrap=EspNativeResidentGameplay_service

; Production-path diagnostics: same owners/layout/optimization, no bringup
; overlays or startup probes. Serial TRACE alters timing, not a speed benchmark.
[env:esp32-cyd-trace]
extends = env:esp32-cyd
build_flags =
    ${env:esp32-cyd.build_flags}
    -D DOOMRPG_LOG_LEVEL=4
    ; Immutable map sprite index, NOT subtype or activation ordinal.
    ; Change this one value for another incident; 106 is the current zombie.
    -D DOOMRPG_ESP32_TRACE_SPRITE=106
