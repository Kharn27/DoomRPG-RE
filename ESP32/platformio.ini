; Doom RPG - ESP32 Cheap Yellow Display (ESP32-2432S028R)

[platformio]
default_envs = esp32-cyd

[env:esp32-cyd]
platform = espressif32@6.12.0
board = esp32dev
framework = arduino
extra_scripts = pre:scripts/build_engine.py

build_type = release
monitor_speed = 115200
upload_speed = 921600
upload_port = /dev/ttyUSB0
monitor_port = /dev/ttyUSB0

; The game data will live on the SD card. This is sufficient for the first
; firmware milestones; it can later be replaced by a larger app partition.
board_build.partitions = no_ota.csv

build_flags =
    -D DOOMRPG_ESP32=1
    -D USER_SETUP_LOADED=1

    ; ILI9341 display, native portrait dimensions. The firmware rotates it to
    ; 320x240 landscape at runtime.
    -D ILI9341_2_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON
    -D TFT_RGB_ORDER=TFT_BGR

    ; TFT on the CYD's HSPI wiring. MISO is intentionally omitted because the
    ; Doom backend only writes to the display.
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=21
    -D TFT_BACKLIGHT_ON=HIGH
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=55000000

    ; Keep only the tiny built-in font for the hardware diagnostic. Doom will
    ; use its own bitmap fonts.
    -D LOAD_GLCD=1

lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43
