name: One-shot credits BMP asset import

on:
  push:
    branches:
      - agent/add-sdroot-credits-image

permissions:
  contents: write

jobs:
  import-bmp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exactly the current feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Pillow (temporary asset conversion only)
        run: python -m pip install pillow
      - name: Reconstruct byte-identical user-provided BMP from RGB-identical source
        run: |
          python - <<'PY'
          from PIL import Image
          from pathlib import Path
          import base64
          import hashlib
          src = Path('sdroot/doomrpg/img/credits.png')
          dst = Path('sdroot/doomrpg/img/credits.bmp')
          with Image.open(src) as image:
              if image.size != (128, 640) or image.mode != "RGB":
                  raise SystemExit(f"unexpected source geometry/mode: {image.size}/{image.mode}")
              rgb = image.load()
              rows = bytearray()
              for y in range(639, -1, -1):
                  for x in range(128):
                      r, g, b = rgb[x, y]
                      rows.extend((b, g, r))
          header = base64.b64decode('Qk2KwAMAAAAAAIoAAAB8AAAAgAAAAIACAAABABgAAAAAAADAAwATCwAAEwsAAAAAAAAAAAAAAAD/AAD/AAD/AAAAAAAAAEJHUnMAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAACAAAAAAAAAAAAAAAAAAAA')
          content = header + rows
          digest = hashlib.sha256(content).hexdigest()
          if len(header) != 138 or len(content) != 245898 or digest != 'd1fe400eb1d7200da604fc1315a43ce1fb6fbc63493768de6b4f730719912c43':
              raise SystemExit(f"asset mismatch len={len(content)} sha256={digest}")
          dst.write_bytes(content)
          print("EXACT BMP READY", len(content), digest)
          PY
      - name: Commit BMP, retire PNG and this one-shot workflow
        run: |
          git config user.name "DoomRPG credits import"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm sdroot/doomrpg/img/credits.png .github/workflows/credits-bmp-import.yml
          git add sdroot/doomrpg/img/credits.bmp
          git commit -m "ASSETS: install exact user BMP 128x640, remove PNG"
          git push origin HEAD:refs/heads/agent/add-sdroot-credits-image
