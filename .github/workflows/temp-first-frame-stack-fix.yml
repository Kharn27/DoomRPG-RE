name: Temporary First Frame Stack Fix

on:
  push:
    branches:
      - 'agent/esp32-native-pickup-feedback'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-pickup-feedback
          fetch-depth: 0
      - name: Apply and commit stack fix
        shell: bash
        run: |
          python3 .github/first-frame-stack-fix.py
          git diff --check
          git rm .github/first-frame-stack-fix.py .github/workflows/temp-first-frame-stack-fix.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32/src/esp_native_first_frame.c
          git commit -m "ESP32: move first-frame scratch off loopTask stack"
          git push origin HEAD:agent/esp32-native-pickup-feedback
