name: Temporary Monster Special Plane Fix

on:
  push:
    branches:
      - 'agent/esp32-native-gameplay-changemap-transition'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-gameplay-changemap-transition
          fetch-depth: 0
      - name: Promote exact legacy special-plane tracing into calcPath
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('ESP32/src/esp_native_gameplay_monster_movement.c')
          s = p.read_text()

          replacements = [
              (
          '''/* Return 1 blocked, 0 clear, -1 not ready, -2 deliberately unsupported special
           * crossing during calcPath's tile-origin legacy subpath. */'''.replace('           *', ' *'),
          '''/* Return 1 blocked, 0 clear, -1 not ready. Type 14/15 entities are not
           * categorically blocking in legacy Game_trace(): with bit 0x20000 set,
           * they count only when the segment crosses the encoded X/Y plane. The
           * bounded specialEntityBlocks() above mirrors that rule for calcPath too. */'''.replace('           *', ' *')
              ),
              (
          '''                                uint16_t attackerSprite,
                                          uint16_t mask,
                                          int strictSpecial) {'''.replace('                                uint16_t', '                                uint16_t', 1),
          '''                                uint16_t attackerSprite,
                                          uint16_t mask) {'''.replace('                                uint16_t', '                                uint16_t', 1)
              ),
              (
          '''        if (type == MOVE_TYPE_SPECIAL_TRACE || type == MOVE_TYPE_SPECIAL_TRACE_2) {
                      if (strictSpecial) return -2;
                      specialBlocks = specialEntityBlocks(i, sourceX, sourceY, destX, destY);'''.replace('                      ', '            '),
          '''        if (type == MOVE_TYPE_SPECIAL_TRACE || type == MOVE_TYPE_SPECIAL_TRACE_2) {
            specialBlocks = specialEntityBlocks(i, sourceX, sourceY, destX, destY);'''
              ),
              (
          '''                              uint16_t attackerSprite,
                              uint16_t mask,
                              int strictSpecial) {''',
          '''                              uint16_t attackerSprite,
                              uint16_t mask) {'''
              ),
              (
          '''                                           attackerSprite, mask, strictSpecial);''',
          '''                                           attackerSprite, mask);'''
              ),
              (
          '''                                       attackerSprite, mask, 1);
            if (clear == -2) {
                result.status = -2;
                return result;
            }''',
          '''                                       attackerSprite, mask);'''
              ),
              ('attackerSprite, mask, 0);', 'attackerSprite, mask);'),
              ('MOVE_TRACE_ATTACK_MASK, 0);', 'MOVE_TRACE_ATTACK_MASK);'),
          ]

          for old, new in replacements:
              count = s.count(old)
              assert count >= 1, f'missing replacement ({count}): {old[:80]!r}'
              s = s.replace(old, new)

          old = '''    if (planStatus == -2) {
              ++movementView.collisionDeferred;
              printf("[MONSTERMOVE] DEFER trigger=%s n=%u sprite=%u cause=calcPath-special-plane-corpus-needed mask=%04x rngCalls=%u mutation=no\\n",
                     trigger, (unsigned int)triggerCount,
                     (unsigned int)candidate.monster->spriteIndex,
                     (unsigned int)movementMaskForSubtype(candidate.monster->subtype),
                     (unsigned int)probeRng.calls);
              return;
          }
          '''.replace('              ', '        ').replace('                     ', '               ').replace('          }', '    }')
          # Avoid depending on indentation normalization: remove by bounded markers.
          marker = '    if (planStatus == -2) {'
          start = s.find(marker)
          assert start >= 0, 'obsolete special-plane defer block missing'
          end = s.find('    if (planStatus < 0) {', start)
          assert end > start, 'planner-not-ready marker missing'
          block = s[start:end]
          assert 'calcPath-special-plane-corpus-needed' in block
          s = s[:start] + s[end:]

          ready_old = 'aiGoal=legacy-cardinal calcPath=2-step traceMask=%04x'
          assert s.count(ready_old) == 1
          s = s.replace(ready_old,
                        'aiGoal=legacy-cardinal calcPath=2-step+special-plane traceMask=%04x',
                        1)

          assert 'strictSpecial' not in s
          assert 'calcPath-special-plane-corpus-needed' not in s
          p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/temp-monster-special-plane-fix.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32/src/esp_native_gameplay_monster_movement.c
          git commit -m "ESP32: trace special planes in monster calcPath"
          git push origin HEAD:agent/esp32-native-gameplay-changemap-transition
