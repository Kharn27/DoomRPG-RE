name: Temporary Monster Special Plane Fix

on:
  push:
    branches:
      - 'agent/esp32-native-gameplay-changemap-transition'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-gameplay-changemap-transition
          fetch-depth: 0
      - name: Promote exact legacy special-plane tracing into calcPath
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('ESP32/src/esp_native_gameplay_monster_movement.c')
          s = p.read_text()

          old_comment = """/* Return 1 blocked, 0 clear, -1 not ready, -2 deliberately unsupported special
           * crossing during calcPath's tile-origin legacy subpath. */""".replace('           *', ' *')
          new_comment = """/* Return 1 blocked, 0 clear, -1 not ready. Type 14/15 entities are not
           * categorically blocking in legacy Game_trace(): with bit 0x20000 set,
           * they count only when the segment crosses the encoded X/Y plane. The
           * bounded specialEntityBlocks() above mirrors that rule for calcPath too. */""".replace('           *', ' *')
          assert old_comment in s
          s = s.replace(old_comment, new_comment, 1)

          s, n = re.subn(
              r'(static int blockingSpriteOnTile\(uint16_t tile,\n(?:.*\n){5}\s+uint16_t mask),\n\s+int strictSpecial\) \{',
              r'\1) {', s, count=1)
          assert n == 1, f'blocking signature replacements={n}'

          assert s.count('            if (strictSpecial) return -2;\n') == 1
          s = s.replace('            if (strictSpecial) return -2;\n', '', 1)

          s, n = re.subn(
              r'(static int cardinalTraceClear\(int32_t sourceX,\n(?:.*\n){4}\s+uint16_t mask),\n\s+int strictSpecial\) \{',
              r'\1) {', s, count=1)
          assert n == 1, f'cardinal signature replacements={n}'

          assert s.count('attackerSprite, mask, strictSpecial);') == 1
          s = s.replace('attackerSprite, mask, strictSpecial);', 'attackerSprite, mask);', 1)

          assert s.count('attackerSprite, mask, 1);') == 1
          s = s.replace('attackerSprite, mask, 1);', 'attackerSprite, mask);', 1)

          special_abort = """            if (clear == -2) {
                result.status = -2;
                return result;
            }
"""
          assert s.count(special_abort) == 1
          s = s.replace(special_abort, '', 1)

          assert s.count('attackerSprite, mask, 0);') == 4
          s = s.replace('attackerSprite, mask, 0);', 'attackerSprite, mask);')
          assert s.count('MOVE_TRACE_ATTACK_MASK, 0);') == 1
          s = s.replace('MOVE_TRACE_ATTACK_MASK, 0);', 'MOVE_TRACE_ATTACK_MASK);', 1)

          marker = '    if (planStatus == -2) {'
          start = s.find(marker)
          assert start >= 0, 'obsolete -2 defer marker missing'
          end = s.find('    if (planStatus < 0) {', start)
          assert end > start, 'planner-not-ready marker missing'
          block = s[start:end]
          assert 'calcPath-special-plane-corpus-needed' in block
          s = s[:start] + s[end:]

          ready_old = 'aiGoal=legacy-cardinal calcPath=2-step traceMask=%04x'
          assert s.count(ready_old) == 1
          s = s.replace(ready_old,
                        'aiGoal=legacy-cardinal calcPath=2-step+special-plane traceMask=%04x',
                        1)

          assert 'strictSpecial' not in s
          assert 'calcPath-special-plane-corpus-needed' not in s
          p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/temp-monster-special-plane-fix.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32/src/esp_native_gameplay_monster_movement.c
          git commit -m "ESP32: trace special planes in monster calcPath"
          git push origin HEAD:agent/esp32-native-gameplay-changemap-transition
