      - name: Install PlatformIO Core
        run: python -m pip install 'platformio>=6.1,<7'

      - name: Build classic CYD firmware
        working-directory: ESP32
        run: pio run -e esp32-cyd

      - name: Build diagnostic CYD bringup firmware
        working-directory: ESP32
        run: pio run -e esp32-cyd-bringup

      - name: Build production-path CYD trace firmware
        working-directory: ESP32
        run: pio run -e esp32-cyd-trace

      - name: SDL-F13 reject dormant controller and mode globals in all three linked ELF
        run: python ESP32/test/sdl_f13_dead_input_mode_host.py --elf

      - name: Verify BT-0 boot guard and link contract in normal ELF
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          root = Path("ESP32/.pio/build")
          marker = b"[BT0] BOOT_HOOK btInUse=1"
          normal = (root / "esp32-cyd/firmware.elf").read_bytes()
          assert marker in normal, "BT-0 boot hook not linked into normal firmware"
          for env in ("esp32-cyd-bringup", "esp32-cyd-trace"):
              assert marker not in (root / env / "firmware.elf").read_bytes(), env
          nm = subprocess.check_output(["xtensa-esp32-elf-nm", str(root / "esp32-cyd/firmware.elf")], text=True)
          assert any(line.endswith(" T btInUse") for line in nm.splitlines()), "btInUse not strong in final ELF"
          assert any(line.endswith(" T initVariant") for line in nm.splitlines()), "initVariant not strong in final ELF"
          print("BT0 ELF: strong btInUse/initVariant in normal; diagnostic ELF inert")
          PY

      - name: Verify sprite timing witnesses absent from production, retained in diagnostic profiles
        run: |
          python - <<'PY'
          from pathlib import Path
          labels = (b'[SPRITEORDER] sample=', b'[SPRITEPHASE] sample=', b'[SPRITEFLASH] sample=')
          normal = Path('ESP32/.pio/build/esp32-cyd/firmware.elf').read_bytes()
          assert all(label not in normal for label in labels), 'production still includes sprite profiling Serial'
          # Both bringup and trace deliberately use DOOMRPG_LOG_LEVEL=4.
          for env in ('esp32-cyd-bringup', 'esp32-cyd-trace'):
              data = (Path('ESP32/.pio/build') / env / 'firmware.elf').read_bytes()
              assert all(label in data for label in labels), f'{env} lost diagnostic sprite witnesses'
          print('PASS normal sprite timings/Serial absent; diagnostics retained in bringup and trace')
          PY

