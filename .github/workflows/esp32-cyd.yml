      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doom-rpg-esp32-cyd-${{ github.sha }}
          path: |
            ESP32/.pio/build/esp32-cyd/*.bin
            ESP32/.pio/build/esp32-cyd/firmware.elf
            ESP32/.pio/build/esp32-cyd/sdl_a_elf_report.json
            ESP32/.pio/build/esp32-cyd-trace/*.bin
