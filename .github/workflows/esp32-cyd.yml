          done

      - name: Reject generated Render source registration in all profiles
        working-directory: ESP32
        run: |
          for profile in esp32-cyd esp32-cyd-bringup esp32-cyd-trace; do
            pio run -e "$profile" -t compiledb
            python tools/audit_desktop_elf.py ".pio/build/$profile" \
