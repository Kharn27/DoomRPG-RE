              --forbid-prefix EspPostLoad --forbid-prefix EspNativePlayingService \
              --forbid-prefix EspNativeGraphics_ --forbid-prefix EspNativeProjectedSprite_ \
              --forbid-prefix EspNativeProjectedWall_ --forbid-prefix DoomRPG_probeNative \
              --forbid-prefix DoomRPG_probeMenuMapRuntimeStructures \
