name: ESP32 CYD Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32-cyd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PlatformIO esp32-cyd
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Test native process RNG owner and 132B root extraction (host C + ABI)
        run: python ESP32/test/native_process_rng_owner_host.py

      - name: Inventory native process RNG root owners and replay guards
        run: python ESP32/test/native_root_rng_ownership_inventory.py

      - name: Self-test bounded playtest incident recorder
        run: |
          python -m py_compile ESP32/tools/playtest_watch.py
          python ESP32/tools/playtest_watch.py --self-test

      - name: Test CHANGEMAP level-completion preflight and durable V11 publication (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -IESP32/include ESP32/src/esp_map_level_exit_stats.c \
            ESP32/test/level_exit_completion_host.c -Wl,--gc-sections \
            -o /tmp/doomrpg-level-exit-commit
          /tmp/doomrpg-level-exit-commit

      - name: Test CHANGEMAP destination spawn before resident teardown (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -IESP32/include ESP32/src/esp_player_spawn_state.c \
            ESP32/src/esp_map_catalog.c ESP32/test/map_spawn_preflight_host.c \
            -Wl,--gc-sections -o /tmp/doomrpg-map-spawn-preflight
          /tmp/doomrpg-map-spawn-preflight

      - name: Test CHANGEMAP WAIT_STATS exclusive full-screen presentation (real C gate)
        run: python ESP32/test/changemap_stats_present_owner_host.py

      - name: Test Junction completed-level event predicate (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/test/level_gate_native_host.c -o /tmp/doomrpg-native-level-gate-test
          /tmp/doomrpg-native-level-gate-test

      - name: Test inert legacy line barrier during barrel radius preflight (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/test/barrel_radius_inert_line_host.c -o /tmp/doomrpg-barrel-radius-inert-line-test
          /tmp/doomrpg-barrel-radius-inert-line-test

      - name: Test Sector 2 BSP visibility capacity and bounded scratch (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/test/native_bsp_visibility_capacity_host.c -o /tmp/doomrpg-native-bsp-visibility-test
          /tmp/doomrpg-native-bsp-visibility-test

      - name: Test Malwrath triple projectile versus Imp single projectile (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/test/malwrath_projectile204_contract_host.c -o /tmp/doomrpg-malwrath-projectile-test
          /tmp/doomrpg-malwrath-projectile-test

      - name: Test cooperative monster turn service budget (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/test/monster_active_sequence_budget_host.c \
            -o /tmp/doomrpg-monster-budget-test
          /tmp/doomrpg-monster-budget-test

      - name: Test native monster attack visual timeline and impact admission (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -Wno-unused-variable \
            -D_POSIX_C_SOURCE=200809L -ffunction-sections -fdata-sections \
            -IESP32/test/host_include -IESP32/include -IESP32/src -Isrc \
            ESP32/test/monster_attack_visual_timeline_host.c \
            -Wl,--gc-sections -o /tmp/doomrpg-monster-visual-timeline-test
          /tmp/doomrpg-monster-visual-timeline-test

      - name: Test Imp projectile 204 sparse catalog prime and rollback (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/src/esp_native_graphics_catalog.c ESP32/test/imp_projectile_catalog_host.c -o /tmp/doomrpg-imp-projectile-catalog-test
          /tmp/doomrpg-imp-projectile-catalog-test

      - name: Test all twelve native WPN grid and familiar touch cells (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -IESP32/include ESP32/src/esp_native_gameplay_hub_weapon_grid.c ESP32/src/esp_main_menu_skin.c ESP32/test/hub_weapon_grid_native_host.c -Wl,--gc-sections -o /tmp/doomrpg-native-weapon-grid-test
          /tmp/doomrpg-native-weapon-grid-test

      - name: Test native store catalog and purchase semantics (host C)
        run: |
          # Compile the real event router as well; the filtered event view
          # deliberately exposes arg2 but NOT the immutable bytecode arg1.
          cc -std=c11 -Wall -Wextra -fsyntax-only -IESP32/include ESP32/src/esp_native_gameplay_action.c
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/src/esp_native_gameplay_store.c ESP32/test/store_native_host.c -o /tmp/doomrpg-native-store-test
          /tmp/doomrpg-native-store-test

      - name: Test lethal barrel damage through real native PlayerState (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -IESP32/include -Isrc ESP32/test/barrel_lethal_damage_host.c ESP32/src/esp_native_gameplay_player_state.c -Wl,--gc-sections -o /tmp/doomrpg-barrel-lethal-test
          /tmp/doomrpg-barrel-lethal-test

      - name: Test original player pain face/palette and reversible expiry (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_player_pain_visual.c \
            ESP32/test/player_pain_visual_host.c \
            -o /tmp/doomrpg-player-pain-visual-test
          /tmp/doomrpg-player-pain-visual-test

      - name: Test original source projectile impact/claw sprites and packed bitshape (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_player_pain_visual.c \
            ESP32/test/player_pain_original_impact_host.c \
            -o /tmp/doomrpg-original-impact-test
          /tmp/doomrpg-original-impact-test

      - name: Test native 500ms original player pain camera shake (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_player_pain_visual.c \
            ESP32/test/player_pain_shake_host.c \
            -o /tmp/doomrpg-player-pain-shake
          /tmp/doomrpg-player-pain-shake

      - name: Test HUB weapon grid blocks asynchronous world pain/effect redraws (host C + source)
        run: python ESP32/test/hub_pain_modal_present_owner_host.py

      - name: Test original 100ms monster damage palette tint (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_player_pain_visual.c \
            ESP32/test/monster_damage_blend_host.c \
            -o /tmp/doomrpg-monster-damage-blend
          /tmp/doomrpg-monster-damage-blend

      - name: Test original gibs_24.bmp 4x6 animation and safe viewport clipping (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_gib_sheet.c \
            ESP32/test/gib_sheet_host.c \
            -o /tmp/doomrpg-gib-sheet-test
          /tmp/doomrpg-gib-sheet-test

      - name: Test native original gibs atlas through real indexed BMP PAK row reader
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_indexed_bmp.c \
            ESP32/src/esp_native_gameplay_gib_sheet.c \
            ESP32/test/gib_sheet_indexed_stream_host.c \
            -o /tmp/doomrpg-gib-sheet-indexed
          /tmp/doomrpg-gib-sheet-indexed

      - name: Test real dog-familiar native absorption reducer and death fail-closed (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_dog_familiar.c \
            ESP32/test/dog_familiar_absorb_host.c \
            -o /tmp/doomrpg-dog-familiar
          /tmp/doomrpg-dog-familiar

      - name: Test original terminal dog corpse and V11 save rollback (real host C owner)
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_monster_drop.c \
            ESP32/src/esp_native_gameplay_dog_familiar.c \
            ESP32/test/dog_corpse_world_host.c \
            -o /tmp/doomrpg-dog-corpse-v11
          /tmp/doomrpg-dog-corpse-v11

      - name: Test dog-familiar source-backed blood (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_gameplay_player_pain_visual.c \
            ESP32/src/esp_native_gameplay_dog_blood.c \
            ESP32/test/dog_blood_visual_host.c \
            -o /tmp/doomrpg-dog-blood-test
          /tmp/doomrpg-dog-blood-test

      - name: Test monster damage direction for all cardinal facings (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/test/directional_damage_side_host.c -o /tmp/doomrpg-directional-damage-test
          /tmp/doomrpg-directional-damage-test

      - name: Test real damage compositor synchronization and delayed service (host C)
        run: |
          # -O2 specializes the NULL runtime UI-only entry; world branches are
          # unreachable in this harness. Suppress existing unrelated warnings.
          cc -O2 -std=c11 -Wall -Wextra -Werror -Wno-unused-variable -Wno-type-limits \
            -D_POSIX_C_SOURCE=200809L -ffunction-sections -fdata-sections \
            -IESP32/test/host_include -IESP32/include -IESP32/src -Isrc \
            ESP32/test/damage_cue_timing_host.c \
            ESP32/src/esp_native_gameplay_player_pain_visual.c \
            -Wl,--gc-sections -o /tmp/doomrpg-damage-cue-timing-test
          /tmp/doomrpg-damage-cue-timing-test

      - name: Test nonblocking PAK pickup miniature FIFO and framebuffer lease (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror \
            -IESP32/test/host_include -IESP32/include -IESP32/src -Isrc \
            ESP32/test/pickup_miniature_host.c \
            -o /tmp/doomrpg-pickup-miniature-test
          /tmp/doomrpg-pickup-miniature-test

      - name: Test actual automap PASS_TURN including hazard, rollback and death (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -IESP32/test/host_include -IESP32/include -IESP32/src -Isrc \
            ESP32/test/pass_turn_automap_host.c -Wl,--gc-sections -o /tmp/doomrpg-pass-turn-automap-test
          /tmp/doomrpg-pass-turn-automap-test
          python ESP32/test/automap_pass_turn_routing_host.py

      - name: Test native automap damage pulse and text without map-wide buffers (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections \
            -IESP32/test/host_include -IESP32/include -IESP32/src -Isrc \
            ESP32/test/automap_damage_host.c -Wl,--gc-sections -o /tmp/doomrpg-automap-damage-test
          /tmp/doomrpg-automap-damage-test

      - name: Test strict allocated ELF comparison (host Python)
        run: python ESP32/test/elf_alloc_compare_host.py

      - name: Test desktop ELF attribution and shared geometry (host Python and C)
        run: |
          python ESP32/test/desktop_elf_audit_host.py
          python ESP32/test/render_geometry_host.py

      - name: Test retired Render skipCull owner, profile guards and native BSP policy
        run: python ESP32/test/native_render_skipcull_retirement_host.py

      - name: Test retired Render half-height mirror and native geometry parity
        run: python ESP32/test/native_render_half_height_retirement_host.py

      - name: Test retired Render clip rectangle and fail-closed platform geometry
        run: python ESP32/test/native_render_clip_rect_retirement_host.py

      - name: Test retirement of generated DoomRPG C oracle and preserved packed SDL (host Python)
        run: python ESP32/test/doomrpg_oracle_retirement_host.py

      - name: Test stateless DoomRPG primitive ownership and reference ABI (host C)
        run: python ESP32/test/doomrpg_pure_primitives_host.py

      - name: SDL-C1 native indexed image decoder, PAK lease and failure rollback
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/src/esp_native_indexed_image.c \
            ESP32/test/native_image_owner_host.c \
            -o /tmp/doomrpg-native-indexed-image
          /tmp/doomrpg-native-indexed-image

      - name: Test native DoomRPG image and PAK resource lifetime (host C)
        run: python ESP32/test/doomrpg_image_resources_host.py

      - name: SDL-D1 native texture/clip/blit ownership gate
        run: python ESP32/test/sdl_d1_native_texture_owner_host.py

      - name: Exercise real permanent indexed SDL shim (host C++)
        run: python ESP32/test/sdl_shim_permanent_host.py

      - name: Retire unlinked SDL window and controller stubs (host static ownership)
        run: python ESP32/test/sdl_dead_control_stubs_host.py

      - name: Retire unused SDL test pattern and circle-only draw helpers
        run: python ESP32/test/sdl_dead_demo_pattern_host.py

      - name: Retire dormant SDL outline and integer-scale shims
        run: python ESP32/test/sdl_dead_render_helpers_host.py

      - name: Retire dormant SDL memory hook facades
        run: python ESP32/test/sdl_dead_memory_hooks_host.py

      - name: Retire dormant SDL keyboard and modal message facades
        run: python ESP32/test/sdl_dead_ui_stub_host.py

      - name: Retire six dormant SDL utilities without touching live paths
        run: python ESP32/test/sdl_dead_utility_facades_host.py

      - name: Retire duplicated SDL 8-bit BMP decoder, retain native packed 1/4/8-bpp loader
        run: python ESP32/test/sdl_dead_duplicate_bmp_host.py

      - name: SDL-F2 reject production SDL present calls and audit native bridge (host Python)
        run: python ESP32/test/sdl_f2_native_present_owner_host.py

      - name: SDL-F3 keep SDL shim host-only, exclude TU from firmware (host Python)
        run: python ESP32/test/sdl_f3_uncompiled_shim_host.py

      - name: SDL-F4 native geometry and texture locals, legacy SDL.h type ABI explicit (host Python)
        run: python ESP32/test/sdl_f4_native_surface_boundary_host.py

      - name: SDL-F5 native Image_t pointer layout and SDL-free texture bridge (host C)
        run: python ESP32/test/sdl_f5_native_image_abi_host.py

      - name: SDL-F6 native header keyboard/RWops boundary, desktop/oracle signatures (host C)
        run: python ESP32/test/sdl_f6_native_header_io_boundary_host.py

      - name: SDL-F7 SDL-free native visual owners, unchanged C source and ABI
        run: python ESP32/test/sdl_f7_native_visual_no_sdl_host.py

      - name: SDL-F8 native intro lifecycle without SDL aliases (host Python)
        run: python ESP32/test/sdl_f8_native_intro_no_sdl_host.py

      - name: SDL-F9 native Render startup without SDLVideo and SDL memory aliases
        run: python ESP32/test/sdl_f9_render_startup_no_sdl_host.py

      - name: SDL-F10 native image bootstrap and first-frame no SDL headers
        run: python ESP32/test/sdl_f10_native_header_only_units_host.py

      - name: SDL-F11 menu and native PAK mappings allocation aliases to libc
        run: python ESP32/test/sdl_f11_native_menu_mappings_libc_host.py

      - name: SDL-F12 engine root/layout libc-only allocations and full Git source parity
        run: python ESP32/test/sdl_f12_engine_stubs_libc_host.py

      - name: SDL-F13 retire dead controller and video-mode facades (host full source oracle)
        run: python ESP32/test/sdl_f13_dead_input_mode_host.py

      - name: Test native presentation and clip pixel parity (host C)
        run: python ESP32/test/doomrpg_presentation_host.py

      - name: Test native process-lifetime DoomRPG clock parity (host C)
        run: python ESP32/test/doomrpg_process_clock_host.py

      - name: Test native CYD config codec and first-run defaults (host C)
        run: python ESP32/test/native_config_host.py

      - name: Test desktop key binding retirement and native touch ownership (host C)
        run: python ESP32/test/desktop_keybind_retirement_host.py

      - name: Test DoomCanvas private indexed glyph blitter contract (host Python)
        run: python ESP32/test/doomcanvas_private_blitter_host.py

      - name: Test Root-I Canvas backref retirement with explicit lifecycle root (host)
        run: python ESP32/test/root_i_canvas_backref_host.py

      - name: Test Root-J MENU_MAIN touch gate with captured process owner (host C + parity)
        run: python ESP32/test/root_j_menu_touch_captured_owner_host.py

      - name: Test Root-J2 Render startup with explicit process token (host C + parity)
        run: python ESP32/test/root_j2_render_startup_token_host.py

      - name: Test Root-J3 pre-render startup with explicit process token (host C + parity)
        run: python ESP32/test/root_j3_prerender_owner_host.py

      - name: Test Root-J4 mappings startup with explicit process token (host C + parity)
        run: python ESP32/test/root_j4_mappings_owner_host.py

      - name: Test Root-J5 layout startup with explicit process token (host C + parity)
        run: python ESP32/test/root_j5_layout_owner_host.py

      - name: Test Root-J6 explicit fatal teardown owner and exact root guard (host C + parity)
        run: python ESP32/test/root_j6_fatal_teardown_owner_host.py

      - name: Test retirement of Canvas desktop plane texture gate (host C + ABI)
        run: python ESP32/test/native_canvas_plane_gate_retirement_host.py

      - name: Test live PlayerState HUD weapon/ammo snapshot and strict close (host C + Python)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -ffunction-sections -fdata-sections -IESP32/include \
            ESP32/src/esp_native_gameplay_hud.c ESP32/src/esp_native_gameplay_weapon_control.c \
            ESP32/test/hub_weapon_live_model_host.c -Wl,--gc-sections -o /tmp/doomrpg-hud-live-model
          /tmp/doomrpg-hud-live-model
          python ESP32/test/hub_weapon_hud_rebase_host.py
          python ESP32/test/hub_hud_baseline_host.py

      - name: Test real native sprite admission parity and fail-closed (host C)
        run: python ESP32/test/native_sprite_bsp_early_admission_host.py

      - name: Test CROSS billboards share exactly one frame load (host C)
        run: python ESP32/test/native_cross_frame_reuse_host.py

      - name: Test input dispatch without 120ms touch cooldown (host Python)
        run: python ESP32/test/native_input_latency_host.py

      - name: Test HUD weapon button and three-tab navigation (host C + source)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include ESP32/src/esp_native_gameplay_input.c ESP32/test/native_hud_weapon_route_host.c -o /tmp/doomrpg-hud-weapon-route
          /tmp/doomrpg-hud-weapon-route
          python ESP32/test/native_hud_weapon_route_host.py

      - name: Test HUD weapon-menu feedback glyph and strict 120ms undo (host C)
        run: |
          cc -O2 -std=c11 -Wall -Wextra -Werror -IESP32/test/host_include -IESP32/include \
            ESP32/src/esp_native_gameplay_controls.c ESP32/test/hud_weapon_feedback_host.c \
            -o /tmp/doomrpg-hud-weapon-feedback
          /tmp/doomrpg-hud-weapon-feedback

      - name: Test native CYD HELP animated starfield, guide and touch parity
        run: python ESP32/test/native_main_help_host.py

      - name: Test original PAK door/wall HELP scene and RGB breathing (host C)
        run: |
          cc -std=c11 -Wall -Wextra -Werror -IESP32/include \
            ESP32/test/native_help_snapshot_host.c \
            ESP32/src/esp_native_help_scene.c \
            -o /tmp/doomrpg-native-help-snapshot
          /tmp/doomrpg-native-help-snapshot

      - name: Test native Canvas const-text ABI retirement (host Python)
        run: python ESP32/test/native_canvas_text_retirement_host.py

      - name: Test full retirement of desktop Game object and Game ABI (host C)
        run: python ESP32/test/game_inert_abi_retirement_host.py

      - name: Test permanent DoomRPG root and fatal cleanup ownership (host C)
        run: python ESP32/test/doomrpg_root_owner_host.py

      - name: Test native DoomRPG error string mirror retirement (host C + ABI)
        run: python ESP32/test/native_root_errorstr_retirement_host.py

      - name: Test native DoomRPG memoryBeg metric retirement (host C + ABI)
        run: python ESP32/test/native_root_memorybeg_retirement_host.py

      - name: Inventory retired DoomRPG desktop owners (native C/C++)
        run: python ESP32/test/native_root_legacy_pointer_inventory.py

      - name: Test grouped native root desktop-owner retirement (actual ABI + source)
        run: python ESP32/test/native_root_desktop_owners_retirement_host.py

      - name: Test native DoomRPG closeApplet retirement (host C + ABI)
        run: python ESP32/test/native_root_closeapplet_retirement_host.py

      - name: Test Render constructor retirement (host C)
        run: python ESP32/test/native_render_init_retirement_host.py

      - name: Test native PAK sine table and Render layout retirement
        run: python ESP32/test/native_trig_owner_host.py

      - name: Test private Render setup parity and ownership (host C)
        run: python ESP32/test/native_render_setup_retirement_host.py

      - name: Test Root-H Render back-reference ownership and ABI (host)
        run: python ESP32/test/root_h_render_backref_host.py

      - name: Test private Render startup and shared framebuffer failure paths (host C)
        run: python ESP32/test/native_render_startup_retirement_host.py

      - name: Test native direct mappings owner and startup ABI (host C)
        run: python ESP32/test/native_render_mappings_retirement_host.py

      - name: Test retired unused legacy Render grayscale ABI (host Python)
        run: python ESP32/test/native_render_gray_retirement_host.py

      - name: Test retired legacy Render plane test entrypoints (host Python)
        run: python ESP32/test/native_render_plane_test_retirement_host.py

      - name: Test retired legacy Render BSP and map ABI (host Python)
        run: python ESP32/test/native_render_bsp_abi_retirement_host.py
      - name: Test retired final legacy Render raster ABI and removed source (host Python)
        run: python ESP32/test/native_render_raster_abi_retirement_host.py

      - name: Test private Render palettes loader byte parity (host C)
        run: python ESP32/test/native_render_palette_retirement_host.py

      - name: Test private Render destructor and runtime slot teardown (host C)
        run: python ESP32/test/native_render_free_retirement_host.py

      - name: Test native Render cleanup from real MENU_MAIN START (host C)
        run: python ESP32/test/native_render_runtime_start_host.py

      - name: Test non-world SAVE slots presentation ownership after SYS EXIT (host C)
        run: python ESP32/test/native_nonworld_present_owner_host.py

      - name: Test final Canvas native teardown and exact release order (host C)
        run: python ESP32/test/native_canvas_release_host.py

      - name: Test Doom-red menu geometry and incremental terminal caret (host C)
        run: python ESP32/test/native_ui_doom_polish_host.py

      - name: Test stateless procedural MENU_MAIN skin and native action routing
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -IESP32/include \
            ESP32/test/main_menu_skin_host.c ESP32/src/esp_main_menu_skin.c \
            -o /tmp/doomrpg-menu-skin-test
          /tmp/doomrpg-menu-skin-test
