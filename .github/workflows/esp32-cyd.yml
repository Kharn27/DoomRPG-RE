name: ESP32 CYD Build

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: esp32-cyd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: PlatformIO esp32-cyd
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: ${{ runner.os }}-platformio-${{ hashFiles('ESP32/platformio.ini') }}
          restore-keys: |
            ${{ runner.os }}-platformio-

      - name: Install PlatformIO Core
        run: python -m pip install 'platformio>=6.1,<7'

      - name: Build classic CYD firmware
        working-directory: ESP32
        run: pio run -e esp32-cyd

      - name: Upload firmware artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doom-rpg-esp32-cyd-${{ github.sha }}
          path: |
            ESP32/.pio/build/esp32-cyd/*.bin
            ESP32/.pio/build/esp32-cyd/firmware.elf
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14
