name: Temporary Adaptive Plane Cache Fix

on:
  push:
    branches:
      - 'agent/esp32-native-pickup-feedback'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-pickup-feedback
          fetch-depth: 0
      - name: Apply adaptive plane cache fix
        shell: bash
        run: |
          python3 .github/adaptive-plane-cache-fix.py
          git diff --check
          git rm .github/adaptive-plane-cache-fix.py .github/workflows/temp-adaptive-plane-cache.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32/src/esp_native_plane_renderer.c
          git commit -m "ESP32: make plane cache adaptive under memory pressure"
          git push origin HEAD:agent/esp32-native-pickup-feedback
