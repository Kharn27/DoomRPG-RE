name: Temporary Transient First Frame Scratch

on:
  push:
    branches:
      - 'agent/esp32-native-pickup-feedback'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-pickup-feedback
          fetch-depth: 0
      - name: Apply transient renderer scratch fix
        shell: bash
        run: |
          python3 .github/transient-first-frame-scratch.py
          git diff --check
          git rm .github/transient-first-frame-scratch.py .github/workflows/temp-transient-first-frame-scratch.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32/src/esp_native_first_frame.c ESP32/include/esp_native_first_frame.h
          git commit -m "ESP32: use transient first-frame renderer scratch"
          git push origin HEAD:agent/esp32-native-pickup-feedback
