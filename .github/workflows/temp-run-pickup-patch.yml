name: Temporary Pickup Patch Runner

on:
  push:
    branches:
      - 'agent/esp32-native-pickup-feedback'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'tooling: run pickup feedback patch payload'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-pickup-feedback
          fetch-depth: 0
      - name: Execute stored patch payload
        shell: bash
        run: |
          python3 -c "from pathlib import Path; s=Path('.github/workflows/temp-apply-pickup-feedback.yml').read_text(); b=s.split(\"python3 - <<'PY'\\n\",1)[1].split(\"\\n          PY\\n\",1)[0]; code='\\n'.join((line[10:] if line.startswith('          ') else line) for line in b.splitlines()); compile(code,'pickup-patch','exec'); exec(compile(code,'pickup-patch','exec'))"
          git diff --check
          git rm .github/workflows/temp-apply-pickup-feedback.yml .github/workflows/temp-run-pickup-patch.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32
          git commit -m "ESP32: add native pickup HUD feedback"
          git push origin HEAD:agent/esp32-native-pickup-feedback
