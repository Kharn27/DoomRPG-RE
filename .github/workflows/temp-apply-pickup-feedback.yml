name: Temporary Pickup Feedback Patch

on:
  push:
    branches:
      - 'agent/esp32-native-pickup-feedback'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.head_commit.message == 'tooling: apply native pickup feedback patch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-pickup-feedback
          fetch-depth: 0

      - name: Apply bounded native pickup feedback
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, got {count}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # Compact EntityDef name lookup: keep names in the PAK and retain only
          # one source-record byte per definition.
          replace_once(
              'ESP32/include/esp_entity_def_type_catalog.h',
              'int EspEntityDefTypeCatalog_getMetadata(uint16_t tileIndex,\n                                        uint8_t* outType,\n                                        uint8_t* outSubtype,\n                                        int32_t* outParm);\nuint32_t EspEntityDefTypeCatalog_definitionCount(void);',
              'int EspEntityDefTypeCatalog_getMetadata(uint16_t tileIndex,\n                                        uint8_t* outType,\n                                        uint8_t* outSubtype,\n                                        int32_t* outParm);\n/* Read the historical 16-byte EntityDef name on demand from /entities.db in\n * DoomRPG-ESP32.pak. Names are never retained per definition in RAM. */\nint EspEntityDefTypeCatalog_readName(uint16_t tileIndex,\n                                     char* outName,\n                                     uint32_t capacity);\nuint32_t EspEntityDefTypeCatalog_definitionCount(void);')

          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              '#define ENTITY_DEF_RECORD_BYTES 24U\n#define ENTITY_DEF_MAX_COUNT 1024U',
              '#define ENTITY_DEF_RECORD_BYTES 24U\n#define ENTITY_DEF_NAME_OFFSET 8U\n#define ENTITY_DEF_NAME_BYTES 16U\n#define ENTITY_DEF_MAX_COUNT 1024U')
          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              'static EntityDefMetadata* entityDefMetadata;\nstatic uint16_t entityDefMetadataCapacity;',
              'static EntityDefMetadata* entityDefMetadata;\n/* Count is capped at 128, so the source record index is exactly one byte.\n * This preserves compact 8 B resident metadata while allowing names to be\n * fetched from the PAK only when presentation actually needs one. */\nstatic uint8_t entityDefSourceIndex[ESP_ENTITY_DEF_TYPE_CATALOG_MAX_DEFINITIONS];\nstatic uint16_t entityDefMetadataCapacity;')
          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              'static void clearCatalog(void) {\n    if (entityDefMetadata != NULL && entityDefMetadataCapacity != 0U) {\n        memset(entityDefMetadata, 0,\n               (size_t)entityDefMetadataCapacity * sizeof(*entityDefMetadata));\n    }\n    clearCatalogFields();\n}',
              'static void clearCatalog(void) {\n    if (entityDefMetadata != NULL && entityDefMetadataCapacity != 0U) {\n        memset(entityDefMetadata, 0,\n               (size_t)entityDefMetadataCapacity * sizeof(*entityDefMetadata));\n    }\n    memset(entityDefSourceIndex, 0xff, sizeof(entityDefSourceIndex));\n    clearCatalogFields();\n}')
          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              'static int insertMetadata(uint16_t tileIndex,\n                          uint8_t type,\n                          uint8_t subtype,\n                          int32_t parm) {',
              'static int insertMetadata(uint16_t tileIndex,\n                          uint8_t type,\n                          uint8_t subtype,\n                          int32_t parm,\n                          uint8_t sourceIndex) {')
          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              '    if (pos < entityDefMetadataCount) {\n        memmove(&entityDefMetadata[pos + 1U],\n                &entityDefMetadata[pos],\n                (size_t)(entityDefMetadataCount - pos) *\n                    sizeof(entityDefMetadata[0]));\n    }\n    entityDefMetadata[pos].tileIndex = tileIndex;\n    entityDefMetadata[pos].type = type;\n    entityDefMetadata[pos].subtype = subtype;\n    entityDefMetadata[pos].parm = parm;\n    ++entityDefMetadataCount;',
              '    if (pos < entityDefMetadataCount) {\n        memmove(&entityDefMetadata[pos + 1U],\n                &entityDefMetadata[pos],\n                (size_t)(entityDefMetadataCount - pos) *\n                    sizeof(entityDefMetadata[0]));\n        memmove(&entityDefSourceIndex[pos + 1U],\n                &entityDefSourceIndex[pos],\n                (size_t)(entityDefMetadataCount - pos));\n    }\n    entityDefMetadata[pos].tileIndex = tileIndex;\n    entityDefMetadata[pos].type = type;\n    entityDefMetadata[pos].subtype = subtype;\n    entityDefMetadata[pos].parm = parm;\n    entityDefSourceIndex[pos] = sourceIndex;\n    ++entityDefMetadataCount;')
          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              '        if (!insertMetadata(tileIndex, record[2], record[3],\n                            readLe32s(record + 4U))) {',
              '        if (!insertMetadata(tileIndex, record[2], record[3],\n                            readLe32s(record + 4U), (uint8_t)i)) {')
          replace_once(
              'ESP32/src/esp_entity_def_type_catalog.c',
              'uint32_t EspEntityDefTypeCatalog_definitionCount(void) {\n    return entityDefTypesReady ? entityDefCount : 0U;\n}',
              '''int EspEntityDefTypeCatalog_readName(uint16_t tileIndex,
                                     char* outName,
                                     uint32_t capacity) {
    const EntityDefMetadata* metadata;
    EspAssetPackEntry entry;
    uint8_t raw[ENTITY_DEF_NAME_BYTES];
    uint16_t pos;
    uint8_t sourceIndex;
    uint32_t copy = 0U;
    int ok = 0;

    if (outName == NULL || capacity < 2U) return 0;
    outName[0] = '\\0';
    metadata = findMetadata(tileIndex);
    if (metadata == NULL || entityDefMetadata == NULL || EspAssetPack_isOpen()) {
        return 0;
    }
    pos = (uint16_t)(metadata - entityDefMetadata);
    if (pos >= entityDefMetadataCount) return 0;
    sourceIndex = entityDefSourceIndex[pos];
    if (sourceIndex == 0xffU) return 0;

    memset(&entry, 0, sizeof(entry));
    memset(raw, 0, sizeof(raw));
    if (!EspAssetPack_open(ESP_ASSET_PACK_DEFAULT_PATH)) return 0;
    if (!EspAssetPack_findEntry("/entities.db", &entry) ||
        (entry.flags & ESP_ASSET_PACK_FLAG_DIRECTORY) != 0U ||
        !EspAssetPack_readRange(&entry,
                                2U + ((uint32_t)sourceIndex * ENTITY_DEF_RECORD_BYTES) +
                                    ENTITY_DEF_NAME_OFFSET,
                                raw, sizeof(raw))) {
        goto done;
    }
    while (copy + 1U < capacity && copy < ENTITY_DEF_NAME_BYTES &&
           raw[copy] != 0U) {
        outName[copy] = (char)raw[copy];
        ++copy;
    }
    outName[copy] = '\\0';
    ok = copy != 0U;

done:
    EspAssetPack_close();
    if (!ok) outName[0] = '\\0';
    return ok;
}

uint32_t EspEntityDefTypeCatalog_definitionCount(void) {
    return entityDefTypesReady ? entityDefCount : 0U;
}''')

