name: Import UAC START button alpha BMPs (one shot)

on:
  push:
    branches:
      - agent/menu-uac-frame-bmp-assets

permissions:
  contents: write

jobs:
  import-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download four Adobe-edited transparent PNGs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/start-assets
          curl --fail --location --silent --show-error --retry 4 --max-time 120 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:5b1e8a38-9edb-4597-9d15-a9fc64fb9cb4" -o "/tmp/start-assets/menu_start_active_120.png"
          curl --fail --location --silent --show-error --retry 4 --max-time 120 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:c518a464-7cd9-470e-9c8d-5c4a24e5d46a" -o "/tmp/start-assets/menu_start_inactive_120.png"
          curl --fail --location --silent --show-error --retry 4 --max-time 120 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:227e281e-bf01-4648-958d-1695c806f6c4" -o "/tmp/start-assets/menu_start_active_240.png"
          curl --fail --location --silent --show-error --retry 4 --max-time 120 "https://photoshop-api.adobe.io/v2/short-url/urn:aaid:ps:US:42e4faf6-5cfd-4e7a-9cfd-3efa33c697f0" -o "/tmp/start-assets/menu_start_inactive_240.png"
      - name: Lossless encode RGBA to BMP V4 BGRA with alpha masks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pillow==11.3.0
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import hashlib, struct

          root = Path('sdroot/doomrpg/img')
          root.mkdir(parents=True, exist_ok=True)
          wanted = {
              'menu_start_active_120': (55, 20),
              'menu_start_inactive_120': (55, 20),
              'menu_start_active_240': (110, 40),
              'menu_start_inactive_240': (110, 40),
          }
          for name, (w, h) in wanted.items():
              path = Path('/tmp/start-assets') / (name + '.png')
              im = Image.open(path)
              im.load()
              assert im.size == (w, h), (name, im.size)
              assert im.mode in ('RGBA', 'P'), (name, im.mode)
              im = im.convert('RGBA')
              alpha = im.getchannel('A')
              lo, hi = alpha.getextrema()
              assert lo == 0 and hi == 255, (name, lo, hi)
              pixels = b''.join(
                  im.crop((0, y, w, y+1)).tobytes('raw', 'BGRA')
                  for y in range(h-1, -1, -1)
              )
              assert len(pixels) == w*h*4
              dib = (
                  struct.pack('<IiiHHIIiiII', 108, w, h, 1, 32, 3, len(pixels), 2835, 2835, 0, 0)
                  + struct.pack('<IIIII', 0x00FF0000, 0x0000FF00, 0x000000FF, 0xFF000000, 0x73524742)
                  + bytes(36)
                  + struct.pack('<III', 0, 0, 0)
              )
              assert len(dib) == 108
              blob = struct.pack('<2sIHHI', b'BM', 122+len(pixels), 0, 0, 122) + dib + pixels
              out = root / (name + '.bmp')
              out.write_bytes(blob)
              verify = Image.open(out).convert('RGBA')
              assert verify.size == (w, h)
              assert verify.tobytes() == im.tobytes(), name
              print(f'{out}: {w}x{h} BMP V4 alpha, {len(blob)} bytes, '
                    f'alpha {lo}..{hi}, SHA256 {hashlib.sha256(blob).hexdigest()}')
          PY
      - name: Commit only four assets and remove temporary importer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdroot/doomrpg/img/menu_start_*.bmp
          git rm .github/workflows/start-button-import.yml
          git diff --cached --stat
          git commit -m "ASSETS: add four resized transparent UAC START button states"
          git push origin HEAD:refs/heads/agent/menu-uac-frame-bmp-assets
