name: UAC full-font design comparison
on:
  push:
    branches: [agent/uac-120-generic-larger-font]
    paths:
      - artwork/fonts/preview_full_repair.py
      - .github/workflows/uac-full-font-review.yml
  workflow_dispatch:
jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install Pillow==11.3.0
      - run: python artwork/fonts/preview_full_repair.py --build --proof --emit-base64
      - run: python artwork/fonts/preview_full_repair.py --check
      - run: python artwork/menu-uac/generic/tools/render_corrected_120.py --write --emit-base64
      - run: python artwork/menu-uac/generic/tools/render_corrected_120.py --check
