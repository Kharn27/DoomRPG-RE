name: Temporary Adaptive Wall Cache Fix

on:
  push:
    branches:
      - 'agent/esp32-native-gameplay-changemap-transition'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/esp32-native-gameplay-changemap-transition
          fetch-depth: 0
      - name: Apply adaptive wall cache fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("ESP32/src/esp_native_first_frame.c")
          s = p.read_text()

          old = '''static int acquireWall(FirstFrameWork* work,
                                 const ResolvedWallTexture* source,
                                 const uint8_t** outTexels) {
              WallCacheSlot* target = NULL;
              uint32_t oldest = UINT32_MAX;
              uint32_t i;

              if (outTexels != NULL) *outTexels = NULL;
              if (work == NULL || source == NULL || outTexels == NULL) return 0;

              ++work->cacheClock;
              if (work->cacheClock == 0U) work->cacheClock = 1U;

              for (i = 0U; i < WALL_CACHE_SLOTS; ++i) {
                  WallCacheSlot* slot = &work->cache[i];
                  if (slot->valid && slot->source != NULL &&
                      slot->source->actualId == source->actualId &&
                      slot->source->sourceTexelOffset == source->sourceTexelOffset) {
                      slot->lastUse = work->cacheClock;
                      ++work->cacheHits;
                      *outTexels = slot->texels;
                      return 1;
                  }
              }

              ++work->cacheMisses;
              for (i = 0U; i < WALL_CACHE_SLOTS; ++i) {
                  WallCacheSlot* slot = &work->cache[i];
                  if (!slot->valid) {
                      target = slot;
                      break;
                  }
                  if (slot->lastUse < oldest) {
                      oldest = slot->lastUse;
                      target = slot;
                  }
              }
              if (target == NULL) return 0;

              if (target->valid) {
                  free(target->texels);
                  memset(target, 0, sizeof(*target));
                  ++work->cacheEvictions;
              }

              target->texels = (uint8_t*)malloc(WALL_PACKED_BYTES);
              if (target->texels == NULL) return 0;
              if (!loadWallTexels(work, source, target->texels)) {
                  free(target->texels);
                  memset(target, 0, sizeof(*target));
                  return 0;
              }

              target->source = source;
              target->lastUse = work->cacheClock;
              target->valid = 1;
              *outTexels = target->texels;
              return 1;
          }
          '''

          new = '''static int acquireWall(FirstFrameWork* work,
                                 const ResolvedWallTexture* source,
                                 const uint8_t** outTexels) {
              WallCacheSlot* target = NULL;
              WallCacheSlot* oldestTarget = NULL;
              WallCacheSlot* unallocatedTarget = NULL;
              uint32_t oldest = UINT32_MAX;
              uint32_t i;

              if (outTexels != NULL) *outTexels = NULL;
              if (work == NULL || source == NULL || outTexels == NULL) return 0;

              ++work->cacheClock;
              if (work->cacheClock == 0U) work->cacheClock = 1U;

              for (i = 0U; i < WALL_CACHE_SLOTS; ++i) {
                  WallCacheSlot* slot = &work->cache[i];
                  if (slot->valid && slot->source != NULL &&
                      slot->source->actualId == source->actualId &&
                      slot->source->sourceTexelOffset == source->sourceTexelOffset) {
                      slot->lastUse = work->cacheClock;
                      ++work->cacheHits;
                      *outTexels = slot->texels;
                      return 1;
                  }
              }

              ++work->cacheMisses;
              for (i = 0U; i < WALL_CACHE_SLOTS; ++i) {
                  WallCacheSlot* slot = &work->cache[i];
                  if (slot->texels != NULL) {
                      if (!slot->valid) {
                          target = slot;
                          break;
                      }
                      if (slot->lastUse < oldest) {
                          oldest = slot->lastUse;
                          oldestTarget = slot;
                      }
                  }
                  else if (slot->lastUse != UINT32_MAX && unallocatedTarget == NULL) {
                      unallocatedTarget = slot;
                  }
              }

              /* The three 2048-byte wall leases are a performance target, not
               * a rendering invariant. Later gameplay owners (notably the
               * dialog topology rollback snapshot) can leave less contiguous
               * heap than the original door-animation witness. Keep every wall
               * lease that was obtained and fall back to an exact narrower LRU
               * instead of failing the frame. Also reuse an evicted slot's
               * buffer rather than free+malloc churning the heap. */
              if (target == NULL && unallocatedTarget != NULL) {
                  unallocatedTarget->texels = (uint8_t*)malloc(WALL_PACKED_BYTES);
                  if (unallocatedTarget->texels != NULL) {
                      target = unallocatedTarget;
                  }
                  else {
                      uint32_t allocated = 0U;
                      unallocatedTarget->lastUse = UINT32_MAX;
                      for (i = 0U; i < WALL_CACHE_SLOTS; ++i) {
                          if (work->cache[i].texels != NULL) ++allocated;
                      }
                      if (allocated == 0U) {
                          printf("[NATIVEFRAME] WALL-CACHE-FAILED slots=0/%u leaseBytes=%u\\n",
                                 (unsigned int)WALL_CACHE_SLOTS,
                                 (unsigned int)WALL_PACKED_BYTES);
                          return 0;
                      }
                      printf("[NATIVEFRAME] WALL-CACHE-FALLBACK slots=%u/%u leaseBytes=%u totalLeaseBytes=%u exact=yes\\n",
                             (unsigned int)allocated,
                             (unsigned int)WALL_CACHE_SLOTS,
                             (unsigned int)WALL_PACKED_BYTES,
                             (unsigned int)(allocated * WALL_PACKED_BYTES));
                  }
              }

              if (target == NULL) target = oldestTarget;
              if (target == NULL || target->texels == NULL) return 0;

              if (target->valid) {
                  target->source = NULL;
                  target->lastUse = 0U;
                  target->valid = 0;
                  ++work->cacheEvictions;
              }

              if (!loadWallTexels(work, source, target->texels)) {
                  printf("[NATIVEFRAME] WALL-CACHE-READ-FAILED logical=%u actual=%u source=%u leaseBytes=%u\\n",
                         (unsigned int)source->logicalId,
                         (unsigned int)source->actualId,
                         (unsigned int)source->sourceTexelOffset,
                         (unsigned int)WALL_PACKED_BYTES);
                  target->source = NULL;
                  target->lastUse = 0U;
                  target->valid = 0;
                  return 0;
              }

              target->source = source;
              target->lastUse = work->cacheClock;
              target->valid = 1;
              *outTexels = target->texels;
              return 1;
          }
          '''

          assert s.count(old) == 1, "acquireWall block changed"
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git diff --check
          git rm .github/workflows/temp-adaptive-wall-cache.yml
          git config user.name "Kharn27"
          git config user.email "32738307+Kharn27@users.noreply.github.com"
          git add ESP32/src/esp_native_first_frame.c
          git commit -m "ESP32: make wall cache adaptive under door memory pressure"
          git push origin HEAD:agent/esp32-native-gameplay-changemap-transition
