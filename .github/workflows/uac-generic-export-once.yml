name: One-shot UAC generic native BMP export
on:
  push:
    branches:
      - agent/uac-generic-button-artwork
    paths:
      - 'artwork/menu-uac/generic/sources/**'
      - 'artwork/menu-uac/generic/tools/export_generic.py'
permissions:
  contents: write
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/uac-generic-button-artwork
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Build exact BMP V4 and verify
        run: |
          python artwork/menu-uac/generic/tools/export_generic.py --write
          python artwork/menu-uac/generic/tools/export_generic.py --check
      - name: Commit native assets back to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sdroot/doomrpg/img/menu_generic_120.bmp sdroot/doomrpg/img/menu_generic_240.bmp artwork/menu-uac/generic/SHA256SUMS.txt
          if ! git diff --cached --quiet; then
            git commit -m "assets(uac): native generic BMP V4 alpha [skip ci]"
            git push origin HEAD:agent/uac-generic-button-artwork
          fi
